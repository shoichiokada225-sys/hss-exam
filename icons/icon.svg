<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 背景: 濃紺ラジアル -->
    <radialGradient id="bgGrad" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#16263f"/>
      <stop offset="55%" stop-color="#0e1a2e"/>
      <stop offset="100%" stop-color="#080f1c"/>
    </radialGradient>
    <!-- 金属質スチールブルー（縁・枠用） -->
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9fc4e8"/>
      <stop offset="30%" stop-color="#4a7fb5"/>
      <stop offset="55%" stop-color="#2b4f7d"/>
      <stop offset="80%" stop-color="#6fa3d4"/>
      <stop offset="100%" stop-color="#35608f"/>
    </linearGradient>
    <linearGradient id="steelDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a5f8c"/>
      <stop offset="50%" stop-color="#1c3557"/>
      <stop offset="100%" stop-color="#2c4d78"/>
    </linearGradient>
    <!-- 文字用: シルバーブルー -->
    <linearGradient id="lettering" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eaf4ff"/>
      <stop offset="45%" stop-color="#bcd8f2"/>
      <stop offset="70%" stop-color="#7fb0dd"/>
      <stop offset="100%" stop-color="#5b8fc4"/>
    </linearGradient>
    <!-- 中央発光 -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5eb2ff" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#2f6fb8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2f6fb8" stop-opacity="0"/>
    </radialGradient>
    <!-- 本の紙面 -->
    <linearGradient id="page" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dcebfa"/>
      <stop offset="100%" stop-color="#8fb6dd"/>
    </linearGradient>
  </defs>

  <!-- 背景（maskable対応: 全面塗り） -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- 背景の微細ドット（左右対称に散らす） -->
  <g fill="#7fb0dd">
    <circle cx="64" cy="120" r="3" opacity="0.18"/>
    <circle cx="448" cy="120" r="3" opacity="0.18"/>
    <circle cx="40" cy="300" r="2.5" opacity="0.14"/>
    <circle cx="472" cy="300" r="2.5" opacity="0.14"/>
    <circle cx="90" cy="430" r="2" opacity="0.12"/>
    <circle cx="422" cy="430" r="2" opacity="0.12"/>
    <circle cx="110" cy="52" r="2" opacity="0.14"/>
    <circle cx="402" cy="52" r="2" opacity="0.14"/>
  </g>

  <!-- 外周リング（メダル） -->
  <circle cx="256" cy="256" r="204" fill="none" stroke="#0a1424" stroke-width="18"/>
  <circle cx="256" cy="256" r="204" fill="none" stroke="url(#steel)" stroke-width="10"/>
  <circle cx="256" cy="256" r="188" fill="none" stroke="url(#steelDark)" stroke-width="3" opacity="0.9"/>

  <!-- 中央発光 -->
  <circle cx="256" cy="230" r="160" fill="url(#coreGlow)"/>
  <circle cx="256" cy="236" r="95" fill="url(#coreGlow)"/>

  <!-- 六角形バッジ（ベベル二重） -->
  <g>
    <polygon points="256,86 396,167 396,329 256,410 116,329 116,167"
             fill="#0c1830" stroke="url(#steel)" stroke-width="12" stroke-linejoin="round"/>
    <polygon points="256,108 377,178 377,318 256,388 135,318 135,178"
             fill="none" stroke="url(#steelDark)" stroke-width="4" stroke-linejoin="round" opacity="0.95"/>
  </g>

  <!-- 上部チェブロン（向上・合格の意匠） -->
  <path d="M 216 148 L 256 118 L 296 148" fill="none" stroke="url(#steel)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- HSS モノグラム（パス描画・フォント非依存） -->
  <!-- H -->
  <g fill="url(#lettering)" stroke="#0c1830" stroke-width="3" paint-order="stroke"
     transform="translate(256 238) scale(0.86) translate(-256 -238)">
    <path transform="translate(-16 0)" d="M 143 186 h 24 v 40 h 32 v -40 h 24 v 104 h -24 v -42 h -32 v 42 h -24 Z"/>
    <!-- S (1) -->
    <path d="M 293 186
             q -20 0 -31 10 q -11 10 -11 26 q 0 14 8.5 21.5 q 8.5 7.5 26.5 12
             q 12 3 16 6 q 4 3 4 8 q 0 6 -5 9 q -5 3 -14 3 q -10 0 -16.5 -4 q -6.5 -4 -8 -11 l -23 7
             q 3 14 15 22 q 12 8 31.5 8 q 21 0 32.5 -9.5 q 11.5 -9.5 11.5 -25.5 q 0 -14 -9 -21.5 q -9 -7.5 -27 -12
             q -12 -3 -16 -6 q -4 -3 -4 -8 q 0 -5.5 4.5 -8.5 q 4.5 -3 12.5 -3 q 8.5 0 14 3.5 q 5.5 3.5 7.5 10 l 23 -6.5
             q -4 -14.5 -15.5 -22 q -11.5 -7.5 -26.5 -7.5 Z"
          transform="translate(-34 0)"/>
    <!-- S (2) -->
    <path d="M 293 186
             q -20 0 -31 10 q -11 10 -11 26 q 0 14 8.5 21.5 q 8.5 7.5 26.5 12
             q 12 3 16 6 q 4 3 4 8 q 0 6 -5 9 q -5 3 -14 3 q -10 0 -16.5 -4 q -6.5 -4 -8 -11 l -23 7
             q 3 14 15 22 q 12 8 31.5 8 q 21 0 32.5 -9.5 q 11.5 -9.5 11.5 -25.5 q 0 -14 -9 -21.5 q -9 -7.5 -27 -12
             q -12 -3 -16 -6 q -4 -3 -4 -8 q 0 -5.5 4.5 -8.5 q 4.5 -3 12.5 -3 q 8.5 0 14 3.5 q 5.5 3.5 7.5 10 l 23 -6.5
             q -4 -14.5 -15.5 -22 q -11.5 -7.5 -26.5 -7.5 Z"
          transform="translate(55 0)"/>
  </g>

  <!-- 開いた本（認定＝学びの証） -->
  <g>
    <path d="M 256 322 q -34 -18 -68 -10 v 56 q 34 -8 68 10 Z" fill="url(#page)" stroke="#2b4f7d" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 256 322 q 34 -18 68 -10 v 56 q -34 -8 -68 10 Z" fill="url(#page)" stroke="#2b4f7d" stroke-width="4" stroke-linejoin="round"/>
    <line x1="256" y1="322" x2="256" y2="378" stroke="#2b4f7d" stroke-width="4"/>
    <!-- 行 -->
    <path d="M 202 330 q 22 -3 40 4 M 202 344 q 22 -3 40 4 M 310 330 q -22 -3 -40 4 M 310 344 q -22 -3 -40 4"
          fill="none" stroke="#3a6ea5" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
  </g>
</svg>
